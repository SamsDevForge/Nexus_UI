name: NEXUS validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXUS_E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: npm ci
      - run: pip install -r backend/requirements.txt
      - run: npm run test:e2e
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus_test
          POSTGRES_PASSWORD: isolated_test_only
          POSTGRES_DB: nexus_notifications_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus_test -d nexus_notifications_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_NOTIFICATION_DATABASE_URL: postgresql+asyncpg://nexus_test:isolated_test_only@localhost:5432/nexus_notifications_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy nexus_api
      - run: python -m pytest -q
